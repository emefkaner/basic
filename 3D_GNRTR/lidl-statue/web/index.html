<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Lina · Gold</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23e2b65a%22/%3E%3C/svg%3E">
<style>
  :root {
    --grund: #16130f;
    --text: #efe6d4;
    --leise: #a89a82;
    --gold: #e2b65a;
    --linie: rgba(239, 230, 212, 0.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--grund); color: var(--text);
    font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; -webkit-font-smoothing: antialiased; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none;
    cursor: grab; }
  canvas:active { cursor: grabbing; }

  .kopf { position: fixed; top: 0; left: 0; right: 0; padding: 20px 24px 0;
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    pointer-events: none; }
  .kopf h1 { margin: 0; font: 600 28px/1 Georgia, "Times New Roman", serif;
    letter-spacing: 0.02em; color: var(--gold); }
  .kopf .mass { color: var(--leise); font-size: 13px; letter-spacing: 0.04em;
    text-transform: uppercase; white-space: nowrap; }

  .fuss { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 24px 22px;
    display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;
    flex-wrap: wrap; pointer-events: none; }
  .hinweis { color: var(--leise); font-size: 13px; }
  .glanz { pointer-events: auto; display: flex; align-items: center; gap: 12px;
    background: rgba(22, 19, 15, 0.72); border: 1px solid var(--linie);
    border-radius: 999px; padding: 8px 16px; backdrop-filter: blur(6px); }
  .glanz label { font-size: 13px; color: var(--leise); white-space: nowrap; }
  .glanz span { font-size: 13px; min-width: 6.5em; color: var(--text); }
  .glanz input { width: 140px; accent-color: var(--gold); }

  .lade { position: fixed; inset: 0; display: grid; place-items: center;
    color: var(--leise); font-size: 14px; letter-spacing: 0.06em; transition: opacity .4s; }
  .lade.weg { opacity: 0; pointer-events: none; }
  .fehler { color: #e8a090; max-width: 32em; text-align: center; padding: 0 24px; }

  @media (max-width: 520px) {
    .kopf { padding: 16px 16px 0; }
    .kopf h1 { font-size: 24px; }
    .fuss { padding: 0 16px 16px; justify-content: center; }
    .hinweis { width: 100%; text-align: center; }
    .glanz input { width: 110px; }
  }
</style>
</head>
<body>
<canvas id="buehne" aria-label="Drehbare Goldfigur"></canvas>

<div class="kopf">
  <h1>Lina</h1>
  <div class="mass">150 mm · Gold metallic</div>
</div>

<div class="fuss">
  <div class="hinweis">Ziehen zum Drehen · Mausrad oder zwei Finger zum Zoomen</div>
  <div class="glanz">
    <label for="glanz">Lack</label>
    <input id="glanz" type="range" min="0" max="100" value="72">
    <span id="glanzText">seidenglänzend</span>
  </div>
</div>

<div class="lade" id="lade">Figur wird geladen …</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const leinwand = document.getElementById("buehne");
const lade = document.getElementById("lade");

const renderer = new THREE.WebGLRenderer({ canvas: leinwand, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
// Neutral-Tonemapping haelt den Farbton -- ACES zieht Gold in den
// Lichtern Richtung Weissgelb und laesst es billiger aussehen.
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.05;

const szene = new THREE.Scene();
szene.background = new THREE.Color(0x16130f);

// Metall lebt von dem, was es spiegelt. Ohne Umgebung waere Gold nur
// ein flaches Braun -- RoomEnvironment liefert einen weichen Studioraum.
const pmrem = new THREE.PMREMGenerator(renderer);
szene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
szene.environmentIntensity = 1.0;

const kamera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 1, 2000);

// Zusaetzlich ein warmes Fuehrungslicht und ein kuehles Gegenlicht --
// die setzen die Glanzkanten an Haaren und Steppmuster.
const fuehrung = new THREE.DirectionalLight(0xfff1dc, 2.2);
fuehrung.position.set(120, 200, 160);
szene.add(fuehrung);
const gegen = new THREE.DirectionalLight(0xcfe0ff, 1.4);
gegen.position.set(-160, 120, -140);
szene.add(gegen);

// Weicher Bodenschatten als Verlauf -- billiger und ruhiger als eine
// echte Schattenkarte, und die Figur steht trotzdem auf etwas.
const schattenTex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d");
  const v = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  v.addColorStop(0, "rgba(0,0,0,0.55)");
  v.addColorStop(0.45, "rgba(0,0,0,0.25)");
  v.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = v; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();
const schatten = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({ map: schattenTex, transparent: true, depthWrite: false })
);
schatten.rotation.x = -Math.PI / 2;
szene.add(schatten);

const gold = new THREE.MeshPhysicalMaterial({
  color: new THREE.Color("#e9b450"),
  metalness: 1.0,
  roughness: 0.3,
  clearcoat: 0.35,          // Lackschicht ueber dem Metallic-Grund
  clearcoatRoughness: 0.2,
});

const steuerung = new OrbitControls(kamera, leinwand);
steuerung.enableDamping = true;
steuerung.dampingFactor = 0.08;
steuerung.enablePan = false;
steuerung.autoRotate = true;
steuerung.autoRotateSpeed = 1.1;
steuerung.maxPolarAngle = Math.PI * 0.62;     // nicht unter den Boden schauen
steuerung.addEventListener("start", () => { steuerung.autoRotate = false; });

// --- Lack-Regler: von Hochglanz bis matt ---
const regler = document.getElementById("glanz");
const reglerText = document.getElementById("glanzText");
function lackSetzen() {
  const t = regler.value / 100;               // 0 = matt, 1 = Hochglanz
  gold.roughness = 0.62 - 0.56 * t;
  gold.clearcoat = 0.15 + 0.75 * t;
  gold.clearcoatRoughness = 0.45 - 0.4 * t;
  reglerText.textContent = t > 0.8 ? "hochglänzend" : t > 0.45 ? "seidenglänzend"
                         : t > 0.2 ? "seidenmatt" : "matt";
}
regler.addEventListener("input", lackSetzen);
lackSetzen();

new GLTFLoader().load(
  "lina.glb",
  (gltf) => {
    const figur = gltf.scene;
    figur.traverse((o) => {
      if (o.isMesh) {
        if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
        o.material = gold;
      }
    });
    szene.add(figur);

    const box = new THREE.Box3().setFromObject(figur);
    const groesse = box.getSize(new THREE.Vector3());
    const mitte = box.getCenter(new THREE.Vector3());
    schatten.scale.set(groesse.x * 1.9, groesse.z * 2.6, 1);
    schatten.position.set(mitte.x, box.min.y + 0.05, mitte.z);

    steuerung.target.set(mitte.x, box.min.y + groesse.y * 0.52, mitte.z);
    const abstand = groesse.y * 2.35;
    kamera.position.set(mitte.x + abstand * 0.18, box.min.y + groesse.y * 0.62, mitte.z + abstand);
    steuerung.minDistance = groesse.y * 0.6;
    steuerung.maxDistance = groesse.y * 4.5;
    steuerung.update();

    lade.classList.add("weg");
    document.body.dataset.bereit = "1";
  },
  undefined,
  (fehler) => {
    lade.innerHTML = '<div class="fehler">Die Figur konnte nicht geladen werden. ' +
      'Liegt <code>lina.glb</code> im selben Ordner wie diese Seite?</div>';
    document.body.dataset.bereit = "fehler";
    console.error(fehler);
  }
);

function groesseAnpassen() {
  kamera.aspect = window.innerWidth / window.innerHeight;
  // Hochkant (Handy): weiter weg, sonst ist die Figur angeschnitten
  kamera.fov = kamera.aspect < 0.8 ? 42 : 30;
  kamera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener("resize", groesseAnpassen);
groesseAnpassen();

renderer.setAnimationLoop(() => {
  steuerung.update();
  renderer.render(szene, kamera);
});
</script>
</body>
</html>
