<text x="620.0" y="560.0" font-family="sans-serif" font-size="13" text-anchor="start" fill="#444">Der Controller ist 42 mm dick, die Mulde nur 30 mm tief.</text>
<text x="620.0" y="582.0" font-family="sans-serif" font-size="13" text-anchor="start" fill="#444">Er steckt also 30 mm in der Mulde und steht 12 mm heraus,</text>
<text x="620.0" y="604.0" font-family="sans-serif" font-size="13" text-anchor="start" fill="#444">das Drehrad 27 mm. Ueber dem Wannenrand hat der Deckel</text>
<text x="620.0" y="626.0" font-family="sans-serif" font-size="13" text-anchor="start" fill="#444">21 mm lichte Hoehe - beides passt hinein, das Rad mit</text>
<text x="620.0" y="648.0" font-family="sans-serif" font-size="13" text-anchor="start" fill="#444">3 mm Luft. Deshalb Rad nach OBEN einlegen.</text>
