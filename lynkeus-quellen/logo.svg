<?xml version="1.0" encoding="UTF-8"?>
<svg id="logo" viewBox="0 0 264 124" width="528" height="248" role="img" aria-label="Lynkeus-Logo">
  <defs>
    <linearGradient id="lgAuge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b18cff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="lgStern" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>

  <!-- Augenumriss (Mandelform) -->
  <path d="M12 62 Q45 18 78 18 Q108 18 130 62 Q108 106 78 106 Q45 106 12 62 Z"
        fill="none" stroke="url(#lgAuge)" stroke-width="9" stroke-linejoin="round"/>

  <!-- doppelte Iris-Sichel -->
  <path d="M76 34 A32 32 0 0 0 76 90" fill="none" stroke="url(#lgAuge)" stroke-width="8" stroke-linecap="round"/>
  <path d="M86 43 A22 22 0 0 0 86 81" fill="none" stroke="url(#lgAuge)" stroke-width="7" stroke-linecap="round"/>

  <!-- Pupille mit Lichtpunkt -->
  <circle cx="101" cy="62" r="15" fill="url(#lgStern)"/>
  <circle cx="107" cy="55" r="5" fill="#ede8dd"/>

  <!-- Strahlenbündel: fächert aus dem Lichtpunkt der Pupille -->
  <g stroke="#9d6bff" stroke-width="6" stroke-linecap="butt">
    <line x1="112" y1="50" x2="161" y2="21"/>
    <line x1="115" y1="57" x2="165" y2="44"/>
    <line x1="116" y1="64" x2="166" y2="64"/>
    <line x1="113" y1="71" x2="159" y2="85"/>
  </g>

  <!-- zersplitterter Stern -->
  <polygon fill="url(#lgStern)" points="
    211,16 218,42 239,26 228,50 256,52 231,63 248,86 222,72 217,100
    206,74 186,90 195,66 170,62 193,53 180,30 202,45"/>
  <!-- Risse (in Hintergrundfarbe) -->
  <g stroke="#0b0e15" stroke-width="3" fill="none" stroke-linejoin="round">
    <path d="M211 32 L206 52 L216 60 L204 76 L208 88"/>
    <path d="M230 46 L215 56 L222 70"/>
    <path d="M196 54 L208 60"/>
    <path d="M206 52 L196 44"/>
  </g>

  <!-- Schockwellen: konzentrische Bögen um den Einschlagpunkt -->
  <g stroke="#9d6bff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M170 40 A28 28 0 0 1 186 30"/>
    <path d="M170 76 A28 28 0 0 0 186 86"/>
    <path d="M163 44 A36 36 0 0 1 174 32"/>
    <path d="M163 72 A36 36 0 0 0 174 84"/>
  </g>
</svg>
