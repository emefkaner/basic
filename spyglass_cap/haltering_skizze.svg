<text x="460.0" y="602" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="400" fill="#6b7a89">Passung: 0,4 mm Spiel einkalkuliert. Zu stramm/locker? CLEARANCE im Skript ändern.</text>
